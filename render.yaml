services:
  - type: web
    name: mlm-doctor
    env: static
    staticPublishPath: .
    buildCommand: echo "No build step required"
    headers:
      # Required for PWA service worker scope
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      # Security headers
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      # All routes fall back to index.html (SPA-style)
      - type: rewrite
        source: /*
        destination: /index.html
